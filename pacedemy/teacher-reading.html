<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhập đề Part 6 và 7 — Pacedemy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0C2422">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="wrap">

  <section class="done hidden" id="view-deny">
    <h1>Không truy cập được</h1>
    <p class="sub">Khu vực này chỉ dành cho giáo viên.</p>
    <div class="done-actions"><a class="btn btn-ink" href="app.html">Về trang học</a></div>
  </section>

  <section class="hidden" id="view-main">
    <div class="greet">
      <h1>Nhập đề Part 6 và Part 7</h1>
      <p>Mỗi đoạn đọc kèm các câu hỏi của nó. Part 6 thường 4 câu, Part 7 từ 2 đến 5 câu mỗi đoạn.</p>
    </div>

    <div class="tbox">
      <h3>Bước 1 · Lấy câu nhắc cho ChatGPT</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-line" id="btn-p6">Câu nhắc Part 6</button>
        <button class="btn btn-line" id="btn-p7">Câu nhắc Part 7</button>
        <button class="btn btn-line" id="btn-sample">Xem ví dụ mẫu</button>
      </div>
      <span id="prompt-ok" style="display:block;margin-top:10px;font-size:0.88rem;color:var(--teal)"></span>
    </div>

    <div class="field">
      <label for="raw">Bước 2 · Dữ liệu đề</label>
      <textarea id="raw" style="min-height:280px;font-family:ui-monospace,monospace;font-size:0.86rem;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r)"
        placeholder="Dán khối dữ liệu ChatGPT trả về vào đây"></textarea>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn btn-ink" id="btn-parse">Xem trước</button>
      <button class="btn btn-gold hidden" id="btn-save">Lưu vào ngân hàng đề</button>
    </div>

    <div id="note" class="note hidden"></div>
    <div id="preview"></div>

    <div class="section-head" style="margin-top:34px"><h2>Đoạn đọc đã có</h2></div>
    <div id="have"><p class="empty">Đang tải…</p></div>
  </section>

  <footer class="app-foot">Learn. Practice. Review. Repeat.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout-settings.js"></script>
<script src="js/teacher-nav.js"></script>
<script src="js/teacher-reading.js"></script>
</body>
</html>
