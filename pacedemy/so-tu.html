<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ từ của tôi — Pacedemy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0C2422">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
  <div class="wrap">
    <a class="brand" href="app.html" style="text-decoration:none">Pac<span class="brand-e">e</span>demy</a>
    <div class="app-user"></div>
  </div>
</header>

<main class="wrap">

  <!-- ---------- Danh sách ---------- -->
  <section id="view-list">
    <div class="section-head">
      <h1>Sổ từ của tôi</h1>
    </div>
    <p class="st-lead">Những từ bạn nhặt được từ chính đề mình đã làm. Ôn lại bằng đúng
      câu đã gặp, nên lúc vào đề thi nhận ra ngay.</p>

    <div id="st-tom"></div>
    <div id="st-list"><p class="empty">Đang tải…</p></div>
  </section>

  <!-- ---------- Màn ôn ---------- -->
  <section class="study hidden" id="view-on">
    <div class="study-top">
      <span>Ôn sổ từ</span>
      <span id="counter"></span>
    </div>
    <div class="study-bar"><span id="progress" style="width:0"></span></div>

    <div class="word-box" id="word-box"></div>
    <div class="opts" id="opts"></div>
    <p class="opt-hint" id="opt-hint"></p>
  </section>

  <!-- ---------- Màn kết ---------- -->
  <section class="done hidden" id="view-done">
    <h1 id="done-title">Xong rồi</h1>
    <p class="big" id="done-score">—</p>
    <p class="sub" id="done-sub"></p>
    <div class="done-actions">
      <button class="btn btn-gold" id="btn-again">Ôn tiếp</button>
      <button class="btn btn-line" id="btn-back">Về sổ từ</button>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout-settings.js"></script>
<script src="js/gate.js"></script>
<script src="js/nav.js"></script>
<script src="js/speak.js"></script>
<script src="js/quiz-progress.js"></script>
<script src="js/so-tu.js"></script>
<script src="js/xong-bai.js"></script>
<script src="js/so-tu-page.js"></script>
</body>
</html>
