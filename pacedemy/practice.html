<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện Part 5 — Pacedemy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0C2422">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="focus-mode">

<header class="app-bar">
  <div class="wrap">
    <a class="brand" href="app.html" style="text-decoration:none">Pac<span class="brand-e">e</span>demy</a>
    <div class="app-user">
      <a class="btn-quiet" href="app.html">Thoát</a>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="study" id="view-q">
    <div class="study-top">
      <span id="part-name">Part 5 — Hoàn thành câu</span>
      <span id="counter"></span>
    </div>
    <div class="study-bar"><span id="progress" style="width:0"></span></div>

    <p class="q-sentence" id="q-text">Đang tải…</p>

    <div class="opts" id="opts"></div>

    <div id="after" class="hidden">
      <p class="verdict" id="verdict"></p>
      <div class="reveal">
        <p class="blk-h" style="margin-bottom:10px">Cần nhớ</p>
        <p class="en" id="why"></p>
      </div>
      <div class="study-actions">
        <button class="btn btn-ink btn-full" id="btn-next">Câu tiếp theo</button>
      </div>
    </div>
  </section>

  <section class="done hidden" id="view-done">
    <h1 id="done-title">Xong bài luyện</h1>
    <p class="big" id="done-score">—</p>
    <p class="sub" id="done-sub"></p>
    <div id="wrong-box"></div>
    <div class="done-actions">
      <button class="btn btn-gold" id="btn-again">Luyện 10 câu nữa</button>
      <a class="btn btn-line" href="app.html">Về trang học</a>
    </div>
  </section>

  <section class="done hidden" id="view-empty">
    <h1>Chưa có câu hỏi</h1>
    <p class="sub">Phần này chưa có câu hỏi nào. Bạn báo giáo viên nhé.</p>
    <div class="done-actions">
      <a class="btn btn-ink" href="app.html">Về trang học</a>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout-settings.js"></script>
<script src="js/gate.js"></script>
<script src="js/nav.js"></script>
<script src="js/practice.js"></script>
</body>
</html>
