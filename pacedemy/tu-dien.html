<header class="app-bar">
  <div class="wrap">
    <a class="brand" href="app.html" style="text-decoration:none">Pac<span class="brand-e">e</span>demy</a>
    <div class="app-user">
      <a class="btn-quiet" href="app.html">Về trang học</a>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="greet">
    <h1>Từ điển</h1>
    <p>Tra tiếng Anh ra tiếng Việt, hoặc gõ tiếng Việt để tìm ngược lại từ tiếng Anh.
       Từ nào có trong đây đều là từ đã gặp trong đề hoặc trong bài học.</p>
  </section>

  <div class="td-thanh">
    <svg class="td-kinh" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input type="search" id="q" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Gõ từ tiếng Anh hoặc nghĩa tiếng Việt…" aria-label="Tra từ">
    <button class="td-xoa hidden" id="q-xoa" type="button" aria-label="Xoá">×</button>
  </div>

  <p class="td-dem" id="dem"></p>

  <div id="ket-qua"></div>

  <!-- Duyệt khi chưa gõ gì -->
  <div id="duyet">
    <div class="section-head" style="margin-top:30px">
      <h2>Duyệt theo chữ cái</h2>
    </div>
    <div class="td-chu" id="chu-cai"></div>

    <div class="section-head" style="margin-top:30px">
      <h2>Duyệt theo chủ đề</h2>
    </div>
    <div class="td-chude" id="chu-de"></div>
  </div>

  <footer class="app-foot">Learn. Practice. Review. Repeat.</footer>
