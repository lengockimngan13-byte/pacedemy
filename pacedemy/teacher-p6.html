<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhập đề Part 6 — Pacedemy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0C2422">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="wrap">

  <section class="done hidden" id="view-deny">
    <h1>Không truy cập được</h1>
    <p class="sub">Khu vực này chỉ dành cho giáo viên.</p>
    <div class="done-actions"><a class="btn btn-ink" href="app.html">Về trang học</a></div>
  </section>

  <section class="hidden" id="view-main">
    <div class="greet">
      <h1>Nhập đề Part 6</h1>
      <p>Mỗi đoạn có bốn chỗ trống và bốn câu hỏi. Chỗ trống viết dạng ---131---, số chỗ trống phải bằng số câu hỏi.</p>
    </div>

    <div class="tbox">
      <h3>Bước 1 · Lấy câu nhắc cho ChatGPT</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-line" id="btn-prompt">Copy câu nhắc Part 6</button>
        <button class="btn btn-line" id="btn-sample">Xem ví dụ mẫu</button>
      </div>
      <span id="prompt-ok" style="display:block;margin-top:10px;font-size:0.88rem;color:var(--teal)"></span>
    </div>

    <div class="field">
      <label for="raw">Bước 2 · Dữ liệu đề</label>
      <textarea id="raw" style="min-height:280px;font-family:ui-monospace,monospace;font-size:0.86rem;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r)"
        placeholder="Dán khối dữ liệu ChatGPT trả về vào đây"></textarea>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <label style="display:flex;align-items:center;gap:8px;font-size:0.92rem;font-weight:600">
        Thuộc Test số
        <input type="number" id="test-no" min="1" placeholder="vd 1"
          style="width:90px;padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--r);font-family:var(--ui)">
      </label>
      <button class="btn btn-ink" id="btn-parse">Xem trước</button>
      <button class="btn btn-gold hidden" id="btn-save">Lưu vào ngân hàng đề</button>
    </div>

    <div id="note" class="note hidden"></div>
    <div id="preview"></div>

    <div class="section-head" style="margin-top:34px"><h2>Đoạn Part 6 đã có</h2></div>

    <div class="filter-bar">
      <select id="f-test"><option value="">Tất cả số Test</option></select>
      <select id="f-state">
        <option value="">Đang hiện và đang ẩn</option>
        <option value="on">Chỉ đoạn đang hiện</option>
        <option value="off">Chỉ đoạn đang ẩn</option>
      </select>
      <input type="search" id="f-text" placeholder="Tìm theo tên đoạn">
      <button class="btn-sm" type="button" id="f-reload">Tải lại</button>
    </div>

    <div id="have"><p class="empty">Đang tải…</p></div>
  </section>

  <footer class="app-foot">Learn. Practice. Review. Repeat.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout-settings.js"></script>
<script src="js/teacher-nav.js"></script>
<script src="js/bulk-list.js"></script>
<script>window.ONLY_PART = 6;</script>
<script src="js/teacher-reading.js"></script>
</body>
</html>
