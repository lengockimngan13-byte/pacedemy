<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-pac { font-family: Lexend, sans-serif; font-size: 64px; font-weight: 700; fill: #0C2422; }
      .text-e { fill: #F0A830; }
    </style>
  </defs>

  <!-- Chữ "Pacedemy" trước hết -->
  <text x="60" y="70" class="text-pac">Pac<tspan class="text-e">e</tspan>demy</text>

  <!-- Con thỏ ôm lấy chữ "Pac" -->
  <!-- Tai trái (phía trên chữ P) -->
  <ellipse cx="75" cy="8" rx="10" ry="32" fill="#0C2422" transform="rotate(-28 75 8)"/>
  
  <!-- Tai phải (phía trên chữ c) -->
  <ellipse cx="125" cy="8" rx="10" ry="32" fill="#0C2422" transform="rotate(28 125 8)"/>
  
  <!-- Đầu (hình tròn ôm lấy chữ, nằm dưới chữ) -->
  <circle cx="100" cy="65" r="28" fill="#0C2422"/>
  
  <!-- Rãnh nhỏ trên đầu (tạo điểm nhấn, giống GitHub) -->
  <path d="M 85 52 Q 100 48 115 52" stroke="#F0A830" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
