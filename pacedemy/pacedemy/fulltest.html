<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi thử full test — Pacedemy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0C2422">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-bar">
  <div class="wrap">
    <a class="brand" href="app.html" style="text-decoration:none">Pac<span class="brand-e">e</span>demy</a>
    <div class="app-user">
      <span class="timer hidden" id="timer">120:00</span>
      <a class="btn-quiet" id="link-out" href="app.html">Về trang học</a>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- Màn hình bắt đầu -->
  <section id="view-start">
    <div class="greet">
      <h1>Thi thử full test</h1>
      <p>Một bài thi đầy đủ, bấm giờ như thi thật. Làm xong mới xem đáp án.</p>
    </div>
    <div id="start-info"><p class="empty">Đang chuẩn bị đề…</p></div>
  </section>

  <!-- Làm bài -->
  <section class="hidden" id="view-test">
    <div class="test-tabs" id="tabs"></div>
    <div id="body"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:22px 0">
      <button class="btn btn-gold" id="btn-submit">Nộp bài</button>
      <span id="count-left" class="stat-lab"></span>
    </div>
  </section>

  <!-- Kết quả -->
  <section class="hidden" id="view-done">
    <div id="result"></div>
    <div id="review"></div>
  </section>

  <footer class="app-foot">Learn. Practice. Review. Repeat.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/gate.js"></script>
<script src="js/fulltest.js"></script>
</body>
</html>
