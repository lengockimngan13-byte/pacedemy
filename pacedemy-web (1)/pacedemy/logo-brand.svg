<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo hộp thẻ: giảm kích thước và đặt bên trái -->
  <g transform="translate(10, 10)">
    <!-- Hộp ngoài -->
    <rect x="15" y="20" width="45" height="32" rx="3" fill="none" stroke="#0C2422" stroke-width="1.2"/>
    
    <!-- Nắp hộp hơi mở -->
    <path d="M 18 20 L 22 12 L 58 12 L 62 20" fill="#0C2422" stroke="none" opacity="0.2"/>
    
    <!-- Lá thẻ 1 -->
    <rect x="21" y="35" width="33" height="15" rx="1.5" fill="#0C2422" opacity="0.15" transform="rotate(-3 37 42)"/>
    
    <!-- Lá thẻ 2 -->
    <rect x="21" y="33" width="33" height="15" rx="1.5" fill="#0C2422" opacity="0.3" transform="rotate(-1 37 40)"/>
    
    <!-- Lá thẻ 3 -->
    <rect x="21" y="31" width="33" height="15" rx="1.5" fill="#0C2422" transform="rotate(0.5 37 38)"/>
    
    <!-- Điểm nhấn: các chấm nhỏ -->
    <circle cx="25" cy="36" r="0.8" fill="#E8E9E4" opacity="0.5"/>
    <circle cx="29" cy="36" r="0.8" fill="#E8E9E4" opacity="0.5"/>
    <circle cx="33" cy="36" r="0.8" fill="#E8E9E4" opacity="0.5"/>
  </g>

  <!-- Chữ "Pacedemy" -->
  <text x="75" y="58" font-family="Lexend, sans-serif" font-size="48" font-weight="700" fill="#0C2422">Pac<tspan fill="#F0A830">e</tspan>demy</text>
</svg>
